apiVersion: apps/v1
kind: Deployment
metadata:
  name: odatrade-api
  namespace: odatrade
  labels:
    app: odatrade-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: odatrade-api
  template:
    metadata:
      labels:
        app: odatrade-api
    spec:
      containers:
        - name: api
          image: odatrade/api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: odatrade-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://odatrade-redis:6379/0"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: odatrade-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: odatrade-api
  namespace: odatrade
spec:
  selector:
    app: odatrade-api
  ports:
    - port: 8000
      targetPort: 8000
  type: LoadBalancer
