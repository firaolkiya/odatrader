# DigitalOcean App Platform spec for OdaTrade
name: odatrade
region: nyc

services:
  - name: api
    github:
      repo: your-org/odatrade
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 2
    instance_size_slug: professional-xs
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: EVENT_BACKEND
        value: redis
    health_check:
      http_path: /health/

  - name: bot-worker
    dockerfile_path: Dockerfile
    instance_count: 1
    instance_size_slug: professional-s
    run_command: python odatrade_cli.py start
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET

  - name: dashboard
    dockerfile_path: Dockerfile.dashboard
    http_port: 8501
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: API_BASE
        value: ${api.PUBLIC_URL}

databases:
  - name: odatrade-db
    engine: PG
    version: "15"
    size: db-s-1vcpu-1gb

  - name: odatrade-redis
    engine: REDIS
    version: "7"
    size: db-s-1vcpu-1gb
