# GCP Cloud Run deployment for OdaTrade API
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: odatrade-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/odatrade-api:latest
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: odatrade-redis-url
                  key: latest
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: odatrade-db-url
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: odatrade-jwt-secret
                  key: latest
            - name: EVENT_BACKEND
              value: redis
          startupProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
