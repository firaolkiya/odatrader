version: "3.9"

# Production overlay — use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  odatrade-api:
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}

  odatrade-bot:
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  odatrade-db:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-odatrade}
    deploy:
      resources:
        limits:
          memory: 2G

  odatrade-redis:
    deploy:
      resources:
        limits:
          memory: 512M
