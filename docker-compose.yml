version: "3.9"

services:
  odatrade-bot:
    build: .
    container_name: odatrade_bot
    restart: always
    volumes:
      - .:/app
    depends_on:
      - odatrade-db
    environment:
      - DATABASE_URL=postgresql://odatrade:odatrade@odatrade-db:5432/odatrade

  odatrade-db:
    image: postgres:13
    container_name: odatrade_db
    restart: always
    environment:
      POSTGRES_DB: odatrade
      POSTGRES_USER: odatrade
      POSTGRES_PASSWORD: odatrade
    ports:
      - "5432:5432"
    volumes:
      - odatrade_data:/var/lib/postgresql/data

  odatrade-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: odatrade_dashboard
    restart: always
    ports:
      - "8501:8501"
    depends_on:
      - odatrade-db
    volumes:
      - .:/app

volumes:
  odatrade_data:
