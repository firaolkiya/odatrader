version: "3.9"

services:
  bot:
    build: .
    container_name: crypto_bot
    restart: always
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://odatrade:odatrade@db:5432/postgres

  db:
    image: postgres:13
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odatrade
      POSTGRES_PASSWORD: odatrade
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:

